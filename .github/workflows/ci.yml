name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}${{ matrix.python && format(' / python {0}', matrix.python) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
          - os: ubuntu-latest
            compiler: clang
            cc: clang
          - os: macos-latest
            compiler: clang
            cc: clang
          - os: windows-latest
            compiler: msvc
            cc: ""
          # Python wrapper: oldest supported and newest Python on Linux,
          # newest on macOS and Windows
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            python: "3.11"
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            python: "3.x"
          - os: macos-latest
            compiler: clang
            cc: clang
            python: "3.x"
          - os: windows-latest
            compiler: msvc
            cc: ""
            python: "3.x"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.python
        id: python
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python build dependencies
        if: matrix.python
        run: python -m pip install cython setuptools

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          PYTHON_OPTIONS: ${{ matrix.python && format('-DBUILD_PYTHON_WRAPPER=ON -DPYTHON_EXECUTABLE={0}', steps.python.outputs.python-path) || '' }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_MINIMAL_EXAMPLE=ON $PYTHON_OPTIONS

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure --parallel 4
